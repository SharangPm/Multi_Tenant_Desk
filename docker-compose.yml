services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]
    ports: ["27017:27017"]
  backend:
    build: ./backend
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/resolvedesk
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-this-refresh-secret}
      CLIENT_URL: http://localhost:5173
      REDIS_URL: ${REDIS_URL:-}
    depends_on: [mongodb]
    ports: ["4000:4000"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:4000/api }
    depends_on: [backend]
    ports: ["5173:80"]
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports: ["6379:6379"]
volumes:
  mongo_data:
